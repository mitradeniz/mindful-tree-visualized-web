server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    return 444;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name branchscript branchscript.neuralithaistudio.com 127.0.0.1 localhost;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-3FIHTsF/5Jq6vBtBFCFjJDuDgmBgytI8kisOrmx3TmE=' 'sha256-p4aPAV4gyjM0bsiYrgcQd6TTwRK34ETs8QrQWfUwglo='; script-src-attr 'none'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'none'; worker-src 'none'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        return 204;
    }

    # The private API must be routed by the trusted edge proxy, never by this public static container.
    location ^~ /api/ {
        return 404;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
    }

    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
    }

    location ~ /\. {
        deny all;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
        limit_except GET HEAD { deny all; }
    }
}
