<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">BranchScript binary search algorithm</title>
  <desc id="desc">A binary search flow containing start, operation, condition, repeat paths, return values, and a changing array.</desc>
  <defs><pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#4d4837" opacity=".5"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".3"/></filter></defs>
  <rect width="1280" height="760" rx="22" fill="#111412"/><rect x="1" y="1" width="1278" height="758" rx="21" fill="none" stroke="#3b4540"/>
  <rect width="1280" height="58" rx="22" fill="#202422"/><rect y="38" width="1280" height="20" fill="#202422"/><rect x="22" y="14" width="30" height="30" rx="8" fill="#10a37f"/><text x="37" y="35" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="16" font-weight="700">B</text><text x="66" y="28" fill="#f0f3f1" font-family="Arial,sans-serif" font-size="14" font-weight="700">Binary Search · algorithm</text><text x="66" y="43" fill="#8e9993" font-family="Arial,sans-serif" font-size="9">Live Run visual explanation</text>
  <rect x="1020" y="13" width="110" height="32" rx="8" fill="#2c2921" stroke="#8a744b"/><text x="1075" y="33" text-anchor="middle" fill="#d7bd88" font-family="Arial,sans-serif" font-size="10" font-weight="700">STEP 4 OF 7</text><rect x="1140" y="13" width="118" height="32" rx="8" fill="#173a30" stroke="#248b70"/><text x="1199" y="33" text-anchor="middle" fill="#86ddc1" font-family="Arial,sans-serif" font-size="10" font-weight="700">STOP RUN</text>
  <rect y="58" width="1280" height="702" fill="#141713"/><rect y="58" width="1280" height="702" fill="url(#grid)"/>
  <g fill="none" stroke="#977c4c" stroke-width="2"><path d="M640 157V192"/><path d="M640 280V310"/><path d="M640 430V466"/><path d="M520 371H347V505"/><path d="M760 371H932V505"/><path d="M347 595V651H640V430"/><path d="M932 595V651H640"/></g>
  <g font-family="Arial,sans-serif" font-size="9" font-weight="700"><rect x="465" y="357" width="35" height="19" rx="8" fill="#24251f" stroke="#8a744b"/><text x="482" y="370" text-anchor="middle" fill="#d8bd86">no</text><rect x="783" y="357" width="39" height="19" rx="8" fill="#24251f" stroke="#8a744b"/><text x="802" y="370" text-anchor="middle" fill="#d8bd86">yes</text><rect x="465" y="638" width="52" height="19" rx="8" fill="#24251f" stroke="#8a744b"/><text x="491" y="651" text-anchor="middle" fill="#d8bd86">repeat</text></g>
  <g filter="url(#shadow)">
    <rect x="505" y="83" width="270" height="74" rx="37" fill="#1f2b28" stroke="#4f806f" stroke-width="2"/><text x="640" y="110" text-anchor="middle" fill="#91b9aa" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">START</text><text x="640" y="137" text-anchor="middle" fill="#eff3f0" font-family="Arial,sans-serif" font-size="16" font-weight="700">sorted values + target</text>
    <rect x="485" y="192" width="310" height="88" rx="18" fill="#202a26" stroke="#4d7565" stroke-width="2"/><text x="512" y="219" fill="#92b2a4" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">OPERATION</text><text x="640" y="250" text-anchor="middle" fill="#eff3f0" font-family="ui-monospace,monospace" font-size="16" font-weight="700">mid = floor((low + high) / 2)</text><text x="640" y="270" text-anchor="middle" fill="#8e9993" font-family="Arial,sans-serif" font-size="10">O(log n) · halve the search space</text>
    <path d="M640 310L760 371L640 430L520 371Z" fill="#2c2921" stroke="#8a744b" stroke-width="2"/><text x="640" y="358" text-anchor="middle" fill="#c0ae86" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">CONDITION</text><text x="640" y="387" text-anchor="middle" fill="#eff3f0" font-family="ui-monospace,monospace" font-size="15" font-weight="700">values[mid] == target?</text>
    <rect x="212" y="505" width="270" height="90" rx="18" fill="#202a26" stroke="#4d7565" stroke-width="2"/><text x="240" y="533" fill="#92b2a4" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">OPERATION</text><text x="347" y="565" text-anchor="middle" fill="#eff3f0" font-family="ui-monospace,monospace" font-size="17" font-weight="700">low = mid + 1</text>
    <rect x="797" y="505" width="270" height="90" rx="18" fill="#29252e" stroke="#725f80" stroke-width="2"/><text x="825" y="533" fill="#aa9ab8" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">RETURN</text><text x="932" y="565" text-anchor="middle" fill="#eff3f0" font-family="ui-monospace,monospace" font-size="17" font-weight="700">return mid</text>
  </g>
  <rect x="80" y="112" width="306" height="220" rx="16" fill="#1b1e1c" stroke="#343b37"/><text x="104" y="141" fill="#76c8ad" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.4">DATA STATE</text><text x="104" y="169" fill="#d9dfdb" font-family="Arial,sans-serif" font-size="14" font-weight="700">values · target 23</text>
  <g font-family="ui-monospace,monospace" font-size="12" text-anchor="middle"><rect x="104" y="192" width="45" height="44" rx="6" fill="#20282c" stroke="#527481"/><rect x="149" y="192" width="45" height="44" rx="6" fill="#20282c" stroke="#527481"/><rect x="194" y="192" width="45" height="44" rx="6" fill="#2c2921" stroke="#d0a557" stroke-width="2"/><rect x="239" y="192" width="45" height="44" rx="6" fill="#20282c" stroke="#527481"/><rect x="284" y="192" width="45" height="44" rx="6" fill="#20282c" stroke="#527481"/><rect x="329" y="192" width="33" height="44" rx="6" fill="#20282c" stroke="#527481"/><g fill="#eff3f0"><text x="126" y="219">4</text><text x="171" y="219">9</text><text x="216" y="219">16</text><text x="261" y="219">23</text><text x="306" y="219">41</text><text x="345" y="219">72</text></g></g>
  <text x="216" y="260" text-anchor="middle" fill="#d8bd86" font-family="Arial,sans-serif" font-size="9" font-weight="700">MID</text><text x="104" y="293" fill="#8e9993" font-family="ui-monospace,monospace" font-size="11">low: 0 · high: 5 · mid: 2</text><rect x="104" y="308" width="225" height="6" rx="3" fill="#2d332f"/><rect x="104" y="308" width="128" height="6" rx="3" fill="#10a37f"/>
  <rect x="1092" y="650" width="146" height="74" rx="12" fill="#1d211f" stroke="#343b37"/><text x="1113" y="677" fill="#d8bd86" font-family="Arial,sans-serif" font-size="9" font-weight="700">ACTIVE</text><text x="1113" y="699" fill="#e6ebe8" font-family="Arial,sans-serif" font-size="11">compare mid</text><circle cx="1218" cy="688" r="7" fill="#10a37f"/>
</svg>
