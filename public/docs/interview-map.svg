<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">BranchScript interview preparation tree</title>
  <desc id="desc">A source editor beside a visual tree containing an interview question, prepared answer, follow-up questions, and evidence.</desc>
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#355044" opacity=".55"/></pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#202422"/><stop offset="1" stop-color="#181b19"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1280" height="760" rx="22" fill="#111412"/>
  <rect x="1" y="1" width="1278" height="758" rx="21" fill="none" stroke="#3b4540"/>
  <rect x="0" y="0" width="1280" height="58" rx="22" fill="#202422"/>
  <rect y="38" width="1280" height="20" fill="#202422"/>
  <rect x="22" y="14" width="30" height="30" rx="8" fill="#10a37f"/><text x="37" y="35" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="16" font-weight="700">B</text>
  <text x="66" y="27" fill="#f0f3f1" font-family="Arial,sans-serif" font-size="14" font-weight="700">BranchScript</text><text x="66" y="43" fill="#8e9993" font-family="Arial,sans-serif" font-size="9">interview.mtree</text>
  <rect x="1091" y="13" width="82" height="32" rx="8" fill="#173a30" stroke="#248b70"/><text x="1132" y="33" text-anchor="middle" fill="#86ddc1" font-family="Arial,sans-serif" font-size="10" font-weight="700">LIVE RUN</text>
  <rect x="1182" y="13" width="76" height="32" rx="8" fill="#10a37f"/><text x="1220" y="33" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10" font-weight="700">+ ADD</text>
  <rect x="0" y="58" width="398" height="702" fill="url(#panel)"/><path d="M398 58V760" stroke="#343b37"/>
  <rect x="18" y="77" width="362" height="36" rx="8" fill="#171a18" stroke="#343b37"/><text x="34" y="100" fill="#9ca7a1" font-family="ui-monospace,monospace" font-size="11">interview.mtree · source</text>
  <g font-family="ui-monospace,monospace" font-size="12">
    <text x="25" y="145" fill="#68716c">1</text><text x="52" y="145" fill="#b8bb86">diagram</text><text x="110" y="145" fill="#d9ddd9"> interview </text><text x="184" y="145" fill="#d8a657">"Backend Interview"</text>
    <text x="25" y="168" fill="#68716c">2</text><text x="52" y="168" fill="#b16286">@view tree</text>
    <text x="25" y="214" fill="#68716c">4</text><text x="52" y="214" fill="#b8bb86">question</text><text x="119" y="214" fill="#d9ddd9"> intro </text><text x="165" y="214" fill="#d8a657">"Tell me about yourself"</text>
    <rect x="45" y="228" width="335" height="25" rx="4" fill="#173b31"/>
    <text x="25" y="246" fill="#68716c">5</text><text x="68" y="246" fill="#b8bb86">response</text><text x="135" y="246" fill="#d9ddd9"> concise </text><text x="202" y="246" fill="#d8a657">"Backend-focused answer"</text>
    <text x="25" y="274" fill="#68716c">6</text><text x="84" y="274" fill="#b16286">@text</text><text x="128" y="274" fill="#d8a657"> "Keep it under two minutes."</text>
    <text x="25" y="297" fill="#68716c">7</text><text x="84" y="297" fill="#b16286">@answer</text><text x="143" y="297" fill="#d8a657"> "I build reliable APIs..."</text>
    <text x="25" y="320" fill="#68716c">8</text><text x="84" y="320" fill="#b16286">@feature</text><text x="150" y="320" fill="#d8a657"> "Follow-up: ownership"</text>
    <text x="25" y="350" fill="#68716c">9</text><text x="84" y="350" fill="#b8bb86">followup</text><text x="151" y="350" fill="#d9ddd9"> scale </text><text x="202" y="350" fill="#d8a657">"How did it scale?"</text>
    <text x="18" y="378" fill="#68716c">10</text><text x="100" y="378" fill="#b8bb86">example</text><text x="159" y="378" fill="#d9ddd9"> metric </text><text x="217" y="378" fill="#d8a657">"Reduced p95 by 38%"</text>
    <text x="18" y="415" fill="#68716c">11</text><text x="84" y="415" fill="#b8bb86">followup</text><text x="151" y="415" fill="#d9ddd9"> tradeoff </text><text x="224" y="415" fill="#d8a657">"What changed?"</text>
  </g>
  <rect x="18" y="690" width="362" height="50" rx="8" fill="#171a18" stroke="#343b37"/><circle cx="35" cy="715" r="4" fill="#10a37f"/><text x="49" y="719" fill="#9ba59f" font-family="Arial,sans-serif" font-size="10">No syntax errors · saved locally</text>
  <rect x="398" y="58" width="882" height="702" fill="#131815"/><rect x="398" y="58" width="882" height="702" fill="url(#grid)"/>
  <g fill="none" stroke="#5c8c76" stroke-width="2"><path d="M839 206V254"/><path d="M839 390V438"/><path d="M839 532V574"/><path d="M839 532C839 558 1051 549 1051 580"/></g>
  <g filter="url(#shadow)">
    <rect x="688" y="112" width="302" height="94" rx="18" fill="#22292d" stroke="#557682" stroke-width="2"/><rect x="688" y="112" width="7" height="94" rx="3" fill="#9eb5be"/>
    <text x="718" y="139" fill="#9eb5be" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">QUESTION</text><text x="718" y="170" fill="#eff3f0" font-family="Arial,sans-serif" font-size="17" font-weight="700">Tell me about yourself</text><text x="718" y="189" fill="#8e9993" font-family="Arial,sans-serif" font-size="11">Choose a focused answer path.</text>
    <rect x="628" y="254" width="422" height="136" rx="20" fill="#202b27" stroke="#4f806f" stroke-width="2"/><rect x="628" y="254" width="7" height="136" rx="3" fill="#91b9aa"/>
    <text x="658" y="281" fill="#91b9aa" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">PREPARED ANSWER</text><text x="658" y="310" fill="#eff3f0" font-family="Arial,sans-serif" font-size="17" font-weight="700">Backend-focused introduction</text><text x="658" y="338" fill="#bac5bf" font-family="Arial,sans-serif" font-size="12">I build reliable APIs and owned the contract,</text><text x="658" y="356" fill="#bac5bf" font-family="Arial,sans-serif" font-size="12">rollout plan, and production dashboards.</text><rect x="658" y="369" width="157" height="15" rx="7" fill="#173b31"/><text x="669" y="380" fill="#75caae" font-family="Arial,sans-serif" font-size="8">FOLLOW-UP · OWNERSHIP</text>
    <rect x="678" y="438" width="322" height="94" rx="18" fill="#29262f" stroke="#766786" stroke-width="2"/><rect x="678" y="438" width="7" height="94" rx="3" fill="#b1a4c0"/>
    <text x="708" y="465" fill="#b1a4c0" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">LIKELY FOLLOW-UP</text><text x="708" y="496" fill="#eff3f0" font-family="Arial,sans-serif" font-size="17" font-weight="700">How did it scale?</text><text x="708" y="515" fill="#8e9993" font-family="Arial,sans-serif" font-size="11">Lead with a measurable result.</text>
    <rect x="600" y="574" width="300" height="92" rx="18" fill="#2d2529" stroke="#80616e" stroke-width="2"/><text x="628" y="602" fill="#b99aa7" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">EVIDENCE</text><text x="628" y="635" fill="#eff3f0" font-family="Arial,sans-serif" font-size="17" font-weight="700">Reduced p95 by 38%</text>
    <rect x="925" y="574" width="270" height="92" rx="18" fill="#2c2922" stroke="#8a744c" stroke-width="2"/><text x="953" y="602" fill="#c0ae88" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">TRADE-OFF</text><text x="953" y="635" fill="#eff3f0" font-family="Arial,sans-serif" font-size="17" font-weight="700">What changed?</text>
  </g>
  <rect x="1055" y="690" width="202" height="50" rx="11" fill="#1d211f" stroke="#343b37"/><circle cx="1076" cy="715" r="5" fill="#10a37f"/><text x="1090" y="719" fill="#aab4ae" font-family="Arial,sans-serif" font-size="10">Active path · 4 steps</text>
</svg>
