name: branchscript-web

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: branchscript:local
    container_name: branchscript
    restart: unless-stopped
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - neuralith-shared

networks:
  neuralith-shared:
    external: true
